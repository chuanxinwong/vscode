<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<!-- {{CSP_SOURCE}} is replaced at runtime. <base href> is injected before </head>. -->

		content="default-src 'none'; script-src {{CSP_SOURCE}} 'unsafe-inline'; style-src {{CSP_SOURCE}} 'unsafe-inline'; img-src {{CSP_SOURCE}} data:; font-src {{CSP_SOURCE}};">
	<title>MyApp</title>
	<link rel="stylesheet" href="css/styles.css">
</head>
<body>
	<h1>MyApp Webview</h1>
	<p>Click a button below:</p>
	<div>
		<button id="btn-send">Send Message</button>
		<button id="btn-write-log">Write Log to D:\log.log</button>
	</div>
	<div id="output"></div>

	<script src="js/app.js"></script>
</body>
</html>
