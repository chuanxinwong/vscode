<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta http-equiv="Content-Security-Policy"
		content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline';">
	<title>MyApp</title>
	<style>
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}

		body {
			font-family: var(--vscode-font-family, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif);
			color: var(--vscode-foreground);
			background-color: var(--vscode-editor-background);
			padding: 16px;
			line-height: 1.5;
		}

		h1 {
			font-size: 18px;
			font-weight: 600;
			margin-bottom: 12px;
		}

		p {
			margin-bottom: 12px;
			color: var(--vscode-descriptionForeground);
		}

		button {
			padding: 6px 14px;
			border: none;
			border-radius: 2px;
			background-color: var(--vscode-button-background);
			color: var(--vscode-button-foreground);
			cursor: pointer;
			font-family: inherit;
			font-size: 13px;
		}

		button:hover {
			background-color: var(--vscode-button-hoverBackground);
		}

		#output {
			margin-top: 12px;
			padding: 8px;
			background-color: var(--vscode-textCodeBlock-background);
			border-radius: 2px;
			font-size: 12px;
		}
	</style>
</head>
<body>
	<h1>Hello from MyApp Webview 1111</h1>
	<p>This is a test page loaded inside VS Code's webview.</p>
	<button id="btn-send">Send Message to VS Code</button>
	<div id="output"></div>

	<script>
		const vscode = acquireVsCodeApi();
		const outputEl = document.getElementById('output');

		document.getElementById('btn-send').addEventListener('click', () => {
			vscode.postMessage({ type: 'hello', text: 'Hello from MyApp webview!' });
			outputEl.textContent = 'Message sent to VS Code.';
		});

		window.addEventListener('message', (event) => {
			const message = event.data;
			if (message.type === 'response') {
				outputEl.textContent = 'VS Code says: ' + message.text;
			}
		});
	</script>
</body>
</html>
